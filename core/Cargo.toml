[package]
name = "ps1core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.130"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
bincode = "1.3"
chd = { version = "0.4", default-features = false, features = ["std", "cd_full", "fast_lzma"] }
miniz_oxide = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
