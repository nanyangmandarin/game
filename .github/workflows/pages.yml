name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install wasm-bindgen CLI (must match Cargo.lock)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Test disc images (CHD via MAME chdman, PBP)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mame-tools
          python3 tools/make_test_images.py "$RUNNER_TEMP/imgs"
          cd "$RUNNER_TEMP/imgs"
          for c in cdlz cdzl cdfl; do chdman createcd -f -i test.cue -o test-$c.chd -c $c,cdzl; done
      - name: Tests
        run: PS1_TESTIMG_DIR="$RUNNER_TEMP/imgs" cargo test --manifest-path core/Cargo.toml --release
      - name: Build WASM
        run: ./build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
