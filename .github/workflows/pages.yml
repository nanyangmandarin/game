name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install wasm-bindgen CLI (must match Cargo.lock)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Test disc images (CHD via MAME chdman, PBP)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mame-tools genisoimage
          python3 tools/make_test_images.py "$RUNNER_TEMP/imgs"
          cd "$RUNNER_TEMP/imgs"
          for c in cdlz cdzl cdfl; do chdman createcd -f -i test.cue -o test-$c.chd -c $c,cdzl; done
          mkdir -p isoroot && printf 'BOOT = cdrom:\\SLUS_011.15;1\r\nTCB = 4\r\n' > isoroot/SYSTEM.CNF
          head -c 300000 /dev/urandom > isoroot/SLUS_011.15 && genisoimage -quiet -o serial.iso isoroot
      - name: Tests
        run: PS1_TESTIMG_DIR="$RUNNER_TEMP/imgs" cargo test --manifest-path core/Cargo.toml --release
      - name: Verify ECM sector rebuild (ECC accepted by MAME chdman)
        run: |
          OUT="$RUNNER_TEMP/ecmcheck"; mkdir -p "$OUT"
          PS1_ECM_OUT="$OUT/good.bin" cargo test --manifest-path core/Cargo.toml --release --lib dump_rebuilt_sectors
          python3 - "$OUT" <<'PY'
          import sys
          d = sys.argv[1]
          b = bytearray(open(f"{d}/good.bin", "rb").read())
          for i in range(len(b) // 2352):
              b[i * 2352 + 2300] ^= 0x5A
          open(f"{d}/bad.bin", "wb").write(b)
          for n in ("good", "bad"):
              open(f"{d}/{n}.cue", "w").write(f'FILE "{n}.bin" BINARY\n  TRACK 01 MODE2/2352\n    INDEX 01 00:00:00\n')
          PY
          for n in good bad; do chdman createcd -f -i "$OUT/$n.cue" -o "$OUT/$n.chd" -c cdzl; done
          g=$(stat -c %s "$OUT/good.chd"); b=$(stat -c %s "$OUT/bad.chd")
          echo "good=$g bad=$b"; test $((g * 2)) -lt "$b"
      - name: Build WASM
        run: ./build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
